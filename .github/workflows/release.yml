name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Ensure v1.0.0 has a release
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already has a release"
          else
            gh release create v1.0.0 \
              --title "dsh-update-checker - v1.0.0" \
              --notes-file .github/release-v1.0.0.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        run: |
          set +e
          npx semantic-release 2>&1 | tee /tmp/release.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 20 /tmp/release.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=semantic-release::$line"
            done
          fi
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
