name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check
        run: npm run check
      - name: Red check
        run: npm run red
      - name: Release guard
        if: github.event_name == 'pull_request'
        run: node dev/release-guard.mjs "origin/${{ github.base_ref }}"
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: node dev/commit-msg.mjs --range "origin/${{ github.base_ref }}..HEAD"
